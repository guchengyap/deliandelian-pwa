# Cloudflare Worker 配置：练声助手线上后端（认证 + 空间数据 + 文件存储）
# 部署步骤见仓库根目录 DEPLOY_CF.md

name = "deliandelian-api"
main = "src/index.js"
compatibility_date = "2026-01-15"

# D1 数据库绑定：先执行
#   npx wrangler d1 create deliandelian
# 然后把返回的 database_id 填到下面。
[[d1_databases]]
binding = "DB"
database_name = "deliandelian"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# 允许的前端来源（逗号分隔，CORS 白名单反射）。
# 生产请确保包含你的 GitHub Pages 地址；本地开发保留 localhost。
ALLOWED_ORIGINS = "https://guchengyap.github.io,http://localhost:3456,http://localhost:5173,http://127.0.0.1:3456"

# JWT 签名密钥不放这里（代码会进仓库），用 secret 管理：
#   npx wrangler secret put JWT_SECRET
